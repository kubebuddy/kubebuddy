{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logging in with Google...</title>

    <link
      rel="icon"
      href="https://www.thinknyx.com/wp-content/uploads/2025/03/KUBEBUDDY-light.png"
      type="image/x-icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/creds.css' %}" />

    <style>
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .status-container {
        text-align: center;
        padding: 40px;
      }
    </style>

    <script>
      (function () {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark-mode");
        }
      })();
    </script>
  </head>
  <body>
    <div class="box d-flex w-100 h-100">
      <div class="login-container">
        <div class="login-card">
          <div class="status-container">
            <div class="login-brand mb-4">
              <img
                class="logo"
                src="https://www.thinknyx.com/wp-content/uploads/2025/03/KUBEBUDDY-light.png"
                width="50"
                height="50"
                alt="KubeBuddy Logo"
              />
            </div>
            <h3>Logging you in...</h3>
            <div class="spinner"></div>
            <p id="status">Processing authentication</p>
          </div>
        </div>
      </div>

      <div class="footer">
        <p class="mb-0">Powered by Thinknyx Technologies LLP</p>
      </div>
    </div>

    <script>
      // ⚠️
      const GOOGLE_CLIENT_ID =
        "139399213981-l1koikk936glk1piqqvjji275b15d8f1.apps.googleusercontent.com";
      const REDIRECT_URI = window.location.origin + "/google-callback/";

      async function completeLogin() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code");
        const error = urlParams.get("error");

        // Handle errors
        if (error) {
          document.getElementById("status").textContent =
            "Login failed: " + error;
          setTimeout(() => (window.location.href = "/"), 2000);
          return;
        }

        if (!code) {
          document.getElementById("status").textContent =
            "No authorization code received";
          setTimeout(() => (window.location.href = "/"), 2000);
          return;
        }

        // Get saved verifier from session storage
        const codeVerifier = sessionStorage.getItem("google_code_verifier");

        if (!codeVerifier) {
          document.getElementById("status").textContent =
            "Session lost. Please try again.";
          setTimeout(() => (window.location.href = "/"), 2000);
          return;
        }

        console.log("✓ Retrieved code verifier from session");

        try {
          document.getElementById("status").textContent =
            "Exchanging code for token...";

          // Exchange authorization code for access token
          const tokenResponse = await fetch(
            "https://oauth2.googleapis.com/token",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded",
              },
              body: new URLSearchParams({
                client_id: GOOGLE_CLIENT_ID,
                code: code,
                code_verifier: codeVerifier, // This proves we started the flow
                grant_type: "authorization_code",
                redirect_uri: REDIRECT_URI,
              }),
            },
          );

          const tokenData = await tokenResponse.json();
          console.log("Token response received");

          if (tokenData.error) {
            throw new Error(tokenData.error_description || tokenData.error);
          }

          document.getElementById("status").textContent =
            "Getting user information...";

          // Get user info using access token
          const userResponse = await fetch(
            "https://www.googleapis.com/oauth2/v2/userinfo",
            {
              headers: {
                Authorization: `Bearer ${tokenData.access_token}`,
              },
            },
          );

          const user = await userResponse.json();
          console.log("✓ User info received:", user.email);

          // Send to Django backend to create session
          document.getElementById("status").textContent =
            "Creating your session...";

          const loginResponse = await fetch("/api/google-login/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie("csrftoken"),
            },
            body: JSON.stringify({
              email: user.email,
              name: user.name,
              picture: user.picture,
            }),
          });

          const loginData = await loginResponse.json();

          if (loginData.success) {
            console.log("✓ Login successful!");
            // Clean up
            sessionStorage.removeItem("google_code_verifier");
            // Redirect to app
            document.getElementById("status").textContent =
              "Success! Redirecting...";
            setTimeout(() => {
              window.location.href = loginData.redirect_url;
            }, 500);
          } else {
            throw new Error(loginData.error || "Login failed");
          }
        } catch (error) {
          console.error("❌ Error:", error);
          document.getElementById("status").innerHTML = `
          <span style="color: #dc3545;">Error: ${error.message}</span><br>
          <small>Redirecting to login page...</small>
        `;
          setTimeout(() => (window.location.href = "/"), 3000);
        }
      }

      // Helper function to get CSRF token
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === name + "=") {
              cookieValue = decodeURIComponent(
                cookie.substring(name.length + 1),
              );
              break;
            }
          }
        }
        return cookieValue;
      }

      // Start the login process when page loads
      completeLogin();
    </script>
  </body>
</html>
