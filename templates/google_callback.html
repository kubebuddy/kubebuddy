{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KubeBuddy - Google Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8f9fa;
      }
      .card {
        max-width: 400px;
        width: 90%;
        text-align: center;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      }
      .spinner-border {
        width: 3rem;
        height: 3rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="loading">
        <div class="spinner-border text-danger mb-4" role="status"></div>
        <h5>Completing Google login...</h5>
        <p class="text-muted">Please wait</p>
      </div>
      <div id="error" style="display: none">
        <div class="text-danger fs-1 mb-3">✕</div>
        <h5>Login Failed</h5>
        <p id="error-msg" class="text-muted"></p>
        <a href="/" class="btn btn-danger mt-2">Back to Login</a>
      </div>
    </div>

    <script>
      (async function () {
        console.log("=== GOOGLE CALLBACK PAGE LOADED ===");

        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const error = params.get("error");

        console.log("URL params:", {
          code: code ? "present" : "missing",
          error,
        });

        if (error || !code) {
          console.error("Error or no code:", error);
          showError(error || "No authorization code received from Google.");
          return;
        }

        console.log("Sending code to /api/google-login/...");

        try {
          const response = await fetch("/api/google-login/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie("csrftoken"),
            },
            body: JSON.stringify({ code: code }),
          });

          console.log("Response status:", response.status);
          const data = await response.json();
          console.log("Response data:", data);

          if (data.success) {
            console.log("Success! Redirecting to:", data.redirect_url);
            window.location.href = data.redirect_url || "/KubeBuddy";
          } else {
            console.error("Login failed:", data.error);
            showError(data.error || "Google login failed.");
          }
        } catch (err) {
          console.error("Network error:", err);
          showError("Network error. Please try again.");
        }
      })();

      function showError(msg) {
        console.error("Showing error:", msg);
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error-msg").textContent = msg;
      }

      function getCookie(name) {
        let val = null;
        document.cookie.split(";").forEach((c) => {
          c = c.trim();
          if (c.startsWith(name + "="))
            val = decodeURIComponent(c.slice(name.length + 1));
        });
        console.log("getCookie(" + name + ") =", val);
        return val;
      }
    </script>
  </body>
</html>
