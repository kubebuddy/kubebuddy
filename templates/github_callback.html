{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KubeBuddy - GitHub Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8f9fa;
      }
      .card {
        max-width: 400px;
        width: 90%;
        text-align: center;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      }
      .spinner-border {
        width: 3rem;
        height: 3rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="loading">
        <div class="spinner-border text-dark mb-4" role="status"></div>
        <h5>Completing GitHub login...</h5>
        <p class="text-muted">Please wait</p>
      </div>
      <div id="error" style="display: none">
        <div class="text-danger fs-1 mb-3">✕</div>
        <h5>Login Failed</h5>
        <p id="error-msg" class="text-muted"></p>
        <a href="/" class="btn btn-dark mt-2">Back to Login</a>
      </div>
    </div>

    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const error = params.get("error");

        if (error || !code) {
          showError(error || "No authorization code received from GitHub.");
          return;
        }

        try {
          const response = await fetch("/api/github-login/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie("csrftoken"),
            },
            body: JSON.stringify({ code: code }),
          });

          const data = await response.json();

          if (data.success) {
            window.location.href = data.redirect_url || "/KubeBuddy";
          } else {
            showError(data.error || "GitHub login failed.");
          }
        } catch (err) {
          showError("Network error. Please try again.");
        }
      })();

      function showError(msg) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error-msg").textContent = msg;
      }

      function getCookie(name) {
        let val = null;
        document.cookie.split(";").forEach((c) => {
          c = c.trim();
          if (c.startsWith(name + "="))
            val = decodeURIComponent(c.slice(name.length + 1));
        });
        return val;
      }
    </script>
  </body>
</html>
